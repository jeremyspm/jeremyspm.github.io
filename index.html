const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* Live due-counts, keyed by app URL. Filled by the ⚡ engine below (it already
   reads every pulse's counts{due,total} for the readiness bars), so a tile can
   state real state instead of encoding it in a decorative colour. Empty until
   an app has been opened once on this device — and then the chip simply
   doesn't appear, rather than showing a confident zero. */
let DUE={};
/* The cold-start test, in one place so the tile chip, the paper summary and the
   readiness bar can never disagree: the app reports that every question it holds
   has never been graded once (`counts.nw`). An app that doesn't send `nw` can
   never be "fresh" here, so it keeps today's rendering exactly. Why it matters:
   due===total on a first visit is arithmetically true and reads as a backlog the
   student never ran up — "579 due · 0% in good standing" before they've tapped
   anything. Same numbers, honest noun. */
const isFresh=r=>!!r&&r.total>0&&r.nw!=null&&r.nw>=r.total;

/* ── owner-only tiles ─────────────────────────────────────────────────────
   A PROJECTS item with `owner:true` is advertised to ONE signed-in account and
   to nobody else. Read this for exactly what it is: it hides the TILE. Both
   pages stay live and publicly reachable at their own URLs, this file still
   contains their names and links, and anyone with the URL or view-source has
   them. It is "not advertised", never access control — if either page must
   actually be private it has to come off Pages, or sit behind the database's
   row-level security the way the traffic readout does.
   Defaults to false, so the very first paint — and every visitor, and every
   load where Cloud is switched off — gets the public hub. */
const OWNER_ONLY='masa64@manukaumail.com';
let IS_OWNER=false;
const visibleProjects=()=>PROJECTS.filter(p=>!p.owner||IS_OWNER);
/* match on PATH, not the whole URL: a tile's href is the absolute production
   URL while a pulse records wherever the app actually ran, so comparing origins
   would break the chip on any other host (and while testing locally). */
const key=u=>{ let p=String(u||'');
  try{ p=new URL(p,location.href).pathname; }catch(e){}
  return p.replace(/index\.html$/,'').replace(/\/+$/,'')||'/'; };
function setDue(map){ DUE=map||{}; render(); }

/* ── v3: PAPERS, not categories. A paper row holds that paper's tools AND its
   deadlines, so a paper with no tool yet (two of the three) is still worth
   opening. Hue per paper is bn2-brief's, so the two apps agree on colour. ── */
const CAT_PAPER={'sem2-hs2':'hs2','sem2-nursing':'inp','sem2-pharm':'pharm'};
/* A tool sits under a paper by its category — or by an explicit `paper` field,
   which is how a cross-semester tool (MedCalc, a clinical skill that isn't
   owned by one paper) is filed under the paper that actually sits it. An
   explicit paper wins, and takes the tool out of the Toolkit so it appears
   exactly once on the page. */
const paperOf=t=>t.paper||CAT_PAPER[t.cat]||'';
const PAPER_HUE={hs2:'--hs', inp:'--inp', pharm:'--ph'};
const PAPER_IC ={hs2:'i-pulse', inp:'i-book', pharm:'i-flask'};
const hueVars=k=>PAPER_HUE[k]?`--hue:var(${PAPER_HUE[k]});--hue-wash:var(${PAPER_HUE[k]}-wash)`:'';
const MONn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYn=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const isoD=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);};
/* effective date: an explicit due, else a window opening, else the earliest
   stream date — the same assumption the ⚡ engine makes until the roster posts */
function effDate(a){
  if(a.due) return isoD(a.due);
  if(a.window) return isoD(a.window.open);
  if(a.streamDates) return isoD(Object.values(a.streamDates).sort()[0]);
  return null;
}
const midn=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};
const dTo=d=>Math.round((midn(d)-midn(new Date()))/86400000);

function toolHtml(p){
  const d=DUE[key(p.url)];
  const tag=isFresh(d)?`<span class="due num fresh">${d.total} to learn</span>`
           :(d&&d.due>0)?`<span class="due num">${d.due} due</span>`
           :(p.badge?`<span class="chip ${p.badge}">${p.badge}</span>`:'');
  return `<a class="tool" href="${p.url}">
    <span class="sq"><svg class="ic"><use href="#${p.ic}"/></svg></span>
    <span class="t"><b>${esc(p.nm)}</b><span>${esc(p.ds)}</span></span>
    ${tag}<svg class="ic cv"><use href="#i-chev"/></svg></a>`;
}
function render(){
  const D=window.DEADLINES||{papers:{},assessments:[]};
  const live=(D.assessments||[]).filter(a=>!a.done&&effDate(a))
    .map(a=>Object.assign({},a,{_d:effDate(a)}))
    .filter(a=>dTo(a._d)>=0).sort((x,y)=>x._d-y._d);

  const papers=Object.keys(D.papers||{}).map(k=>{
    const p=D.papers[k];
    const tools=visibleProjects().filter(t=>paperOf(t)===k);
    // A paper is "fresh" only if EVERY enrolled tool is — one tool part-way
    // through means the due count is real and gets stated as a due count.
    const withCounts=tools.map(t=>DUE[key(t.url)]).filter(Boolean);
    const fresh=withCounts.length>0&&withCounts.every(isFresh);
    const due=tools.reduce((s,t)=>{const d=DUE[key(t.url)];return s+((d&&d.due)||0);},0);
    const tot=withCounts.reduce((s,r)=>s+r.total,0);
    // the collapsed summary states real counts only — no tool, it says so.
    // Deadlines are deliberately absent: they live at the top of the page.
    const sum=[tools.length?tools.length+(tools.length===1?' tool':' tools'):'No tools yet'];
    if(fresh) sum.push(`<em>${tot} to learn</em>`);
    else if(due) sum.push(`<em>${due} due</em>`);

    let i=0;
    const body=`<div class="pad">
      ${tools.length
        ? tools.map(t=>`<div class="stg" style="--i:${i++}">${toolHtml(t)}</div>`).join('')
        : `<div class="none stg" style="--i:${i++}"><b>No tool for this paper yet</b>
             Nothing is being tracked here, so this paper contributes nothing to your ⚡ sessions.
             <button class="go" data-sugg="1">Suggest one →</button></div>`}
    </div>`;

    return `<section class="paper" data-k="${k}" style="${hueVars(k)}">
      <button class="phead" aria-expanded="false" aria-controls="p-${k}">
        <span class="sq"><svg class="ic"><use href="#${PAPER_IC[k]||'i-book'}"/></svg></span>
        <span class="t"><b>${esc(p.name)}</b><span>${sum.join(' · ')}</span></span>
        <svg class="ic chev"><use href="#i-chev"/></svg>
      </button>
      <div class="pbody" id="p-${k}" role="region" aria-label="${esc(p.name)}"><div class="pinner">${body}</div></div>
    </section>`;
  }).join('');

  // anything not owned by a single paper: the semester schedule, clinical skills, career
  const kit=visibleProjects().filter(t=>!paperOf(t));

  $('#sections').innerHTML=`
    <div class="sechead"><h2>Semester 2</h2><a class="lk" href="bn2-brief.html">Full schedule →</a></div>
    <div class="papers">${papers}</div>
    <div class="sechead"><h2>Toolkit</h2><span class="lk" style="color:var(--tx2);font-weight:650">Across all papers</span></div>
    <div class="kit">${kit.map(toolHtml).join('')}</div>`;

  // one open at a time — keeps the page short and the choice obvious
  const host=$('#sections');
  const setOpen=(sec,open)=>{ sec.classList.toggle('open',open);
    sec.querySelector('.phead').setAttribute('aria-expanded',open?'true':'false'); };
  host.querySelectorAll('.paper').forEach(sec=>{
    sec.querySelector('.phead').onclick=()=>{
      const willOpen=!sec.classList.contains('open');
      host.querySelectorAll('.paper').forEach(s=>setOpen(s,false));
      setOpen(sec,willOpen);
      try{ localStorage.setItem('hub.openPaper', willOpen?sec.dataset.k:''); }catch(e){}
    };
  });
  host.querySelectorAll('[data-sugg]').forEach(b=>b.onclick=e=>{ e.preventDefault(); $('#btnSugg').click(); });
  // on arrival: the paper you last opened, else the one owning the next deadline
  let k=''; try{ k=localStorage.getItem('hub.openPaper')||''; }catch(e){}
  if(k===null||k===undefined) k='';
  if(!k && live[0]) k=live[0].paper;
  const sec=k && host.querySelector(`.paper[data-k="${k}"]`);
  if(sec) setOpen(sec,true);

  const n=new Date();
  $('#today').textContent=`${DAYn[n.getDay()]} ${n.getDate()} ${MONn[n.getMonth()]}`;
}
const TK='hub.theme';
function applyTheme(){ document.documentElement.setAttribute('data-theme',localStorage.getItem(TK)||'dark'); }
$('#btnTheme').onclick=()=>{ localStorage.setItem(TK,(localStorage.getItem(TK)||'dark')==='dark'?'light':'dark'); applyTheme(); };
applyTheme();
render();

/* Re-render once we know who is signed in, so the owner's tiles appear (and
   vanish again on sign-out). onChange fires immediately with the current user,
   so this resolves on load rather than after a round trip. Guarded because
   Cloud is optional: with it off the hub simply stays in its public state. */
if(window.Cloud && Cloud.enabled && Cloud.onChange){
  Cloud.onChange(u=>{
    const own=!!(u && String(u.email||'').toLowerCase()===OWNER_ONLY);
    if(own!==IS_OWNER){ IS_OWNER=own; render(); }
  });
}

/* ---------- ⚡ Study engine (v1) — see STUDY-ENGINE-SPEC.md ----------
   Apps bid CARDS onto the shared-origin bus (studybus.pulse.*, v2); the
   hub weights them by the DEADLINES calendar and plays them RIGHT HERE —
   one card at a time, produce → reveal → self-grade. Every grade writes
   back to the owning app's studybus.grades.* log. kind:'link' offers
   (true drills, e.g. MedCalc) become the one outro hand-off after the
   cards. Semester-agnostic: BN3 is a data append in deadlines.js. */
(function(){
  const D=window.DEADLINES; if(!D){ return; }
  const DAY=86400e3, HOUR=3600e3,
        PK='studybus.plan', BK='studybus.budget', SK='studybus.streak',
        HP='studybus.hubplays', LK='studybus.last';
  /* honest per-type minutes. A chain costs more the more of it is hidden:
     L1/L2 blank one thing inside a chain you can still see; L3/L4 are full
     reconstructions. (Contract 2, "the playable unit".) */
  const CARD_MIN={flash:0.6,mcq:0.7,saq:1.5,chain:1.2};
  const estMin=c=>c.type==='chain'?((+c.level>=3)?2.0:1.2):(CARD_MIN[c.type]||0.8);
  /* A card the player can actually render. A chain needs its beads/verbs to
     line up (n+1 beads, n verbs) or the occlusion indexes mean nothing. */
  const cardOK=c=>!!(c&&c.id&&(c.type==='chain'
    ? (Array.isArray(c.beads)&&c.beads.length>=2&&Array.isArray(c.verbs)&&c.verbs.length===c.beads.length-1)
    : (c.q&&CARD_MIN[c.type])));

  /* ---- the SR-state channel (contract addition, 2026-07-27) ----------------
     An app may publish `ladder` on its pulse (its own box→days table + the box
     delta each grade applies) and `sr:{box,level,lapses}` on each card. That is
     the whole cost of the reward beat: the hub can then state the rest a recall
     just earned, using the owning app's OWN scheduler — it still never parses a
     foreign SRS blob, it just reads numbers the app chose to publish.

     No ladder or no sr ⇒ NO DIALS. We never show a plausible-looking interval
     we can't stand behind (same rule as the readiness bars and `counts`). */
  function earned(ladder,sr,r){
    if(!ladder||!sr) return null;
    const days=ladder.boxDays; if(!Array.isArray(days)||!days.length) return null;
    const maxBox=Number.isFinite(ladder.maxBox)?ladder.maxBox:days.length-1;
    const step=ladder.step||{};
    const gid=['again','hard','good','easy'][r];
    const s=step[gid];
    let box=Math.max(0,Math.min(maxBox,+sr.box||0));
    const from=box;
    if(s==='reset'||r===0) box=0;
    else if(typeof s==='number') box=Math.max(0,Math.min(maxBox,box+s));
    else return null;                       // an app we can't read — say nothing
    const lvlFrom=Math.max(1,Math.min(4,+sr.level||1));
    // scaffolding climbs only on a clean recall at a box that has survived a
    // real interval — Giga's LEVEL_UP_BOX (srs-constants.js:27), app-published.
    const lub=Number.isFinite(ladder.levelUpBox)?ladder.levelUpBox:null;
    const lvlTo=(lub!=null&&r>=2&&box>=lub&&lvlFrom<4)?lvlFrom+1:lvlFrom;
    return { days:days[box]|0, boxUp:box>from, levelFrom:lvlFrom, levelTo:lvlTo,
             levelUp:lvlTo>lvlFrom, again:r===0 };
  }
  // "when it comes back" → a calm human phrase (study-progress.js:83)
  function returnLabel(d){
    if(!(d>0)) return 'back shortly';
    if(d===1) return 'tomorrow';
    if(d<30) return 'in '+d+' days';
    const m=Math.round(d/30); return m<=1?'in about a month':'in '+m+' months';
  }
  const today=new Date().setHours(0,0,0,0);
  const parseD=s=>new Date(s+'T12:00:00').getTime();
  const jget=(k,d)=>{ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } };
  const jset=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
  const addQ=(u,q)=>u+(u.includes('?')?'&':'?')+q;

  // next future sitting of an assessment, or null if past/done/archived.
  // nextPick also reports WHICH kind of date won, so the strip can label it
  // honestly (a window close and a stream guess are not a fixed exam date).
  function nextPick(a){
    if(a.done) return null;
    const p=D.papers[a.paper]; if(p&&p.archived) return null;
    let c=[];
    if(a.window) c.push({iso:a.window.close,how:'window'});
    else if(a.streamDates) c=(D.stream&&a.streamDates[D.stream])
      ? [{iso:a.streamDates[D.stream],how:'due'}]
      : Object.values(a.streamDates).map(iso=>({iso,how:'stream'}));
    else if(a.due) c.push({iso:a.due,how:'due'});
    (a.resits||[]).forEach(r=>c.push({iso:r,how:'resit'}));
    const fut=c.map(x=>({...x,t:parseD(x.iso)})).filter(x=>x.t>=today).sort((x,y)=>x.t-y.t);
    return fut.length?fut[0]:null;
  }
  function nextDate(a){ const p=nextPick(a); return p?p.t:null; }
  // score = evPerMin × weight × urgency × hurdleBoost, vs the offer's strongest assessment
  function scoreOffer(o,pulse){
    let best=0, bestA=null;
    (o.assess||[]).forEach(id=>{
      const a=D.assessments.find(x=>x.id===id);
      if(!a||a.kind==='assignment'||a.kind==='signoff') return;   // recall work only
      const t=nextDate(a); if(t==null) return;
      const d=Math.max(0,(t-today)/DAY);
      const W=a.hurdle?1:(a.weight?a.weight/100:0.03);
      const s=W * (1/(1+d/7)) * (a.hurdle&&d<=21?3:1);
      if(s>best){ best=s; bestA=a; }
    });
    if(!bestA) return null;
    // stale pulses undersell their app (cards decayed since ts) — inflate, plus a neglect bump
    const age=(Date.now()-(pulse.ts||0))/DAY;
    let f=Math.min(2,Math.exp(age/7)); if(age>7) f*=1.25;
    return { score:(o.evPerMin||0.2)*best*f, paper:bestA.paper };
  }
  /* ---- retired apps (the cull list) ---------------------------------------
     A pulse is a localStorage key with no expiry, so an app that has been
     superseded keeps bidding its cards forever — the hub has no way to know
     the tile went away. Naming the app id here is the off switch: its pulse
     is deleted (not just skipped) on every hub load, along with its grade log
     and any recent-play entries, so it can't feed the ⚡ queue, the readiness
     bars or the tile chips. Re-enrolling = delete the id from this set.
       · pharmhub — old Pharmacology Hub, retired 2026-07-27
       · module1  — old Module 1 Pre-Class Deep Dive, retired 2026-07-27. Its
         tile was commented out that day but the pulse kept bidding: it offers
         the SAME assessments as the rebuilt hs2m1 (hs2-t1, hs2-final), so it
         was taking 5 of every 15 ⚡ cards, adding a duplicate 74 to the hs2-t1
         and hs2-final readiness bars, and swallowing grades into its own
         `m1_srs` boxes — reps hs2m1's scheduler never saw. Note a stale pulse
         is BOOSTED, not decayed (see scoreOffer), so an abandoned app sits at
         max boost forever; un-advertising alone is never enough. */
  const RETIRED=new Set(['pharmhub','module1']);
  function purgeRetired(){
    RETIRED.forEach(app=>{
      try{
        localStorage.removeItem('studybus.pulse.'+app);
        localStorage.removeItem('studybus.grades.'+app);
      }catch(e){}
    });
    const h=jget(HP,{}); let ch=false;
    for(const k in h){ if(RETIRED.has(k.split(':')[0])){ delete h[k]; ch=true; } }
    if(ch) jset(HP,h);
  }
  purgeRetired();
  function pulses(){
    const out=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.indexOf('studybus.pulse.')===0){
        const p=jget(k,null);
        // v2 only — v1 pulses described URL legs (the retired handoff model)
        if(p&&p.v===2&&p.app&&p.url&&Array.isArray(p.offers)&&!RETIRED.has(p.app)) out.push(p);
      }
    }
    return out;
  }
  // what the player graded recently, before the owning app has consumed its
  // grade log — stops ⚡-twice-in-a-row replaying what you just nailed
  function plays(){
    const h=jget(HP,{}), now=Date.now(); let ch=false;
    for(const k in h){ if(now-h[k].ts>48*HOUR){ delete h[k]; ch=true; } }
    if(ch) jset(HP,h);
    return h;
  }
  function buildPlan(budget){
    const played=plays(), now=Date.now();
    const offers=[], links=[];
    pulses().forEach(p=>p.offers.forEach(o=>{
      const r=scoreOffer(o,p); if(!r) return;
      const base={ app:p.app, appName:p.name||p.app, label:o.label||p.name||p.app,
        topic:o.topic||null, score:r.score, paper:r.paper, ladder:p.ladder||null };
      if(o.kind==='link'&&o.deep!=null){
        links.push({...base, url:p.url+o.deep, minutes:Math.max(3,Math.min(o.minutes||6,10))});
      } else if(Array.isArray(o.cards)&&o.cards.length){
        // suppress cards nailed in the last 12h; recent misses jump the queue
        const cs=o.cards
          .filter(cardOK)
          .filter(c=>{ const h=played[p.app+':'+c.id]; return !(h&&h.r>=2&&now-h.ts<12*HOUR); })
          .sort((a,b)=>{
            const ha=played[p.app+':'+a.id], hb=played[p.app+':'+b.id];
            return ((hb&&hb.r===0)?1:0)-((ha&&ha.r===0)?1:0);
          });
        if(cs.length) offers.push({...base, cards:cs});
      }
    }));
    offers.sort((a,b)=>b.score-a.score); links.sort((a,b)=>b.score-a.score);
    const outro=links.length?[links[0]]:[];
    // interleave chunks of ~2 cards round-robin over offers by priority;
    // ≤60% of minutes from one paper once ≥2 papers have apps enrolled
    const nPapers=new Set(offers.map(o=>o.paper).concat(outro.map(o=>o.paper))).size;
    const cap=nPapers>1?budget*0.6:budget;
    const per={}, queue=[];
    let used=0;
    if(outro.length){ used=Math.min(outro[0].minutes,budget); per[outro[0].paper]=used; }
    const cursors=offers.map(()=>0);
    let progress=true;
    while(progress&&used<budget&&queue.length<40){
      progress=false;
      for(let i=0;i<offers.length&&used<budget;i++){
        const o=offers[i];
        for(let t=0;t<2;t++){
          const c=o.cards[cursors[i]]; if(!c) break;
          const m=estMin(c);
          if(used+m>budget+0.3) break;
          if(nPapers>1&&(per[o.paper]||0)+m>cap) break;
          cursors[i]++; used+=m; per[o.paper]=(per[o.paper]||0)+m;
          queue.push({ app:o.app, appName:o.appName, label:o.label, topic:o.topic,
            paper:o.paper, score:o.score, ladder:o.ladder, card:c });
          progress=true;
        }
      }
    }
    return { v:2, builtTs:Date.now(), budget, estMin:Math.round(used*10)/10,
      nCards:queue.length, queue, outro, hub:location.origin+location.pathname };
  }
  // fallback when no app has enrolled yet: point at the nearest deadline
  function nearest(){
    let best=null;
    D.assessments.forEach(a=>{ const t=nextDate(a); if(t!=null&&(!best||t<best.t)) best={t,a}; });
    return best;
  }

  /* ══════════════ FOCUSED MODE ══════════════════════════════════════════════
     Guided answers "what should I do?". Focused answers "let me drill THIS".
     Both play the identical player and write grades back identically — the only
     difference is who chose the queue. That matters: a focused session must not
     become a second, weaker SRS that quietly forgets to tell the owning app.

     THE ONE HONESTY RULE HERE. Guided may silently drop an app whose deadlines
     have passed, because it is ranking. Focused is a menu, and a menu that hides
     items is a broken menu — so the catalogue lists everything on the bus and
     labels what it cannot rank, rather than omitting it. */
  const TYPE_LABEL={chain:'Pathways',saq:'Written',mcq:'Recognition'};
  const TYPE_WHY={chain:'rebuild a pathway from memory',saq:'say the marking points aloud',
                  mcq:'spot the right answer'};
  // paper of an offer, ignoring dates — scoreOffer's paper is date-gated and
  // returns null once everything it feeds is in the past.
  function offerPaper(o){
    for(const id of (o.assess||[])){
      const a=D.assessments.find(x=>x.id===id);
      if(a) return a.paper;
    }
    return null;
  }
  /* Everything currently bid, grouped paper → app → topic. Built fresh at open
     time, never cached: an app republishes its pulse on every visit, so a cached
     catalogue is a list of yesterday's questions. */
  function catalog(){
    const played=plays(), now=Date.now(), papers={};
    pulses().forEach(p=>{
      (p.offers||[]).forEach(o=>{
        const pid=offerPaper(o)||'_other';
        const P=papers[pid]||(papers[pid]={id:pid,
          name:(D.papers[pid]&&D.papers[pid].name)||'Other', apps:{}});
        const A=P.apps[p.app]||(P.apps[p.app]={app:p.app, name:p.name||p.app, url:p.url,
          ladder:p.ladder||null, scope:p.scope||null, topics:[], links:[]});
        if(o.kind==='link'&&o.deep!=null){
          A.links.push({label:o.label||A.name, url:p.url+o.deep,
            minutes:Math.max(3,Math.min(o.minutes||6,10))});
          return;
        }
        const cs=(o.cards||[]).filter(cardOK);
        if(!cs.length) return;
        // "fresh" = not nailed in the last 12h. Shown, but sorted behind, so a
        // topic never vanishes from the menu just because you did it this morning.
        const byType={};
        cs.forEach(c=>{ (byType[c.type]=byType[c.type]||[]).push(c); });
        A.topics.push({ id:o.topic||o.label, label:o.label||A.name, cards:cs, byType:byType,
          counts:o.counts||null,
          fresh:cs.filter(c=>{ const h=played[p.app+':'+c.id]; return !(h&&h.r>=2&&now-h.ts<12*HOUR); }).length });
      });
    });
    // drop papers that ended up with nothing playable
    Object.keys(papers).forEach(k=>{
      const P=papers[k];
      Object.keys(P.apps).forEach(a=>{
        if(!P.apps[a].topics.length&&!P.apps[a].links.length) delete P.apps[a];
      });
      if(!Object.keys(P.apps).length) delete papers[k];
    });
    return papers;
  }
  /* Pack a chosen set of cards to the budget. Deliberately NOT buildPlan: there
     is no scoring, no paper cap and no round-robin, because the player has
     already said what they want — imposing a 60% paper cap on a queue somebody
     hand-picked would be the app overruling them. Order is still due-first, so a
     short session inside a big selection is the most useful slice of it. */
  function buildFocused(sel,budget){
    const played=plays(), now=Date.now(), pool=[];
    sel.topics.forEach(t=>{
      t.cards.forEach(c=>{
        if(!sel.types.has(c.type)) return;
        const h=played[sel.app.app+':'+c.id];
        pool.push({ app:sel.app.app, appName:sel.app.name, label:t.label, topic:t.id,
          paper:sel.paperId, score:0, ladder:sel.app.ladder, card:c,
          _miss:(h&&h.r===0)?0:1, _done:(h&&h.r>=2&&now-h.ts<12*HOUR)?1:0 });
      });
    });
    // recent misses first, then everything unseen, then what you already nailed today
    pool.sort((a,b)=>(a._miss-b._miss)||(a._done-b._done));
    const queue=[]; let used=0;
    for(const leg of pool){
      const m=estMin(leg.card);
      if(used+m>budget+0.3) break;
      if(queue.length>=40) break;
      used+=m; queue.push(leg);
    }
    return { v:2, focused:true, builtTs:Date.now(), budget, estMin:Math.round(used*10)/10,
      nCards:queue.length, queue, outro:[], available:pool.length,
      hub:location.origin+location.pathname };
  }
  // plain-English "what is this?" — works for a stranger and for future-admin-me
  function showHelp(){
    const n=nearest();

  /* ---------- 🗓 What's coming — the calendar, made visible ----------------
     Rows come straight from DEADLINES (previously invisible on this page —
     you had to open the brief to learn anything was due). The readiness bar
     is rolled up from the counts{due,total} every card app ALREADY ships on
     its pulse offers, so it costs nothing and needs no app changes.

     HONESTY RULES (non-negotiable — this number decides what you revise):
       · The bar measures ONE thing: of the questions an app is currently
         offering for that assessment, the share not due for review. It is
         NOT syllabus coverage and never claims to be — hence "in play",
         not "loaded": apps bid ≤5 decks, so the denominator moves.
       · Every bar prints the question count beside it, so "100%" can't
         oversell twelve cards for a twelve-week paper. Exam rows say so
         outright, since a one-module deck bids into a whole-paper final.
       · No deck → no bar. A row with nothing behind it says so plainly
         rather than showing a comforting empty track. Same for written work
         and for live drills (MedCalc), which keep their state in-app.
       · A weak spot is named only when it genuinely lags the assessment's
         own average — never on a cold start, where "worst" is just sort order. */
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const fmtD=iso=>{ const d=new Date(iso+'T12:00:00');
    return WD[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; };
  const fmtT=t=>String(t).length===4?String(t).slice(0,2)+':'+String(t).slice(2):String(t);
  function whenLabel(a,p){
    if(p.how==='window') return 'window closes '+fmtD(p.iso);
    if(p.how==='stream') return fmtD(p.iso)+' at the earliest · your stream isn’t set';
    const base=fmtD(p.iso)+(p.how==='resit'?' (next resit)':'');
    if(a.timeUnconf) return base+' · time not confirmed';
    return base+(a.time?' · '+fmtT(a.time):'');
  }
  // assessment id → { total, due, offers[], links[] } across every fresh pulse
  function rollup(){
    const m={}, get=id=>m[id]||(m[id]={total:0,due:0,nw:0,anyNw:false,offers:[],links:[]});
    pulses().forEach(p=>(p.offers||[]).forEach(o=>{
      (o.assess||[]).forEach(id=>{
        const r=get(id);
        if(o.kind==='link'){ r.links.push({label:o.label,app:p.name||p.app,url:p.url}); return; }
        // counts is the app's own SRS truth; cards[] is only the slice it bid
        const c=o.counts||{};
        const total=Number(c.total)||(Array.isArray(o.cards)?o.cards.length:0);
        if(!total) return;
        const due=Math.max(0,Math.min(Number(c.due)||0,total));
        r.total+=total; r.due+=due;
        if(c.nw!=null){ r.anyNw=true; r.nw+=Math.max(0,Math.min(Number(c.nw)||0,total)); }
        r.offers.push({label:o.label||p.name||p.app,total,due});
      });
    }));
    return m;
  }
  // The single shakiest deck — named ONLY when it genuinely stands out.
  // On a cold start every deck sits at 100% due, so the "worst" one is just
  // whatever sorted first; calling that a weak spot would be inventing a
  // finding. Require it to lag the assessment's own average by a clear
  // margin, and to have enough cards behind it to mean anything.
  function weakest(r){
    if(r.offers.length<2||!r.total) return null;
    const avg=r.due/r.total;
    const c=r.offers.filter(o=>o.total>=3&&o.due>=2)
      .sort((x,y)=>y.due/y.total-x.due/x.total)[0];
    return (c&&c.due/c.total>=0.34&&c.due/c.total-avg>=0.15)?c.label:null;
  }
  // per-app due totals, for the tile chips (same numbers as the bars — one read)
  function dueByApp(){
    const m={};
    pulses().forEach(p=>{
      let due=0,total=0,nw=0,anyNw=false,any=false;
      (p.offers||[]).forEach(o=>{
        if(o.kind==='link') return;
        const c=o.counts||{};
        const t=Number(c.total)||(Array.isArray(o.cards)?o.cards.length:0);
        if(!t) return;
        any=true; total+=t; due+=Math.max(0,Math.min(Number(c.due)||0,t));
        // `nw` (never graded once) is optional. An app that doesn't send it is
        // simply never called fresh — old rendering, unchanged. No inferring.
        if(c.nw!=null){ anyNw=true; nw+=Math.max(0,Math.min(Number(c.nw)||0,t)); }
      });
      if(any) m[key(p.url)]={due:due,total:total,nw:anyNw?nw:null};
    });
    return m;
  }
  const dlRows=()=>D.assessments.map(a=>({a,p:nextPick(a)})).filter(x=>x.p)
    .sort((x,y)=>x.p.t-y.p.t||(y.a.weight||0)-(x.a.weight||0));
  // floor, not round: dates are noon-anchored against local midnight, so
  // a sitting 3 days out reads 3.5 — and must agree with the ⚡ button
  const daysTo=p=>Math.max(0,Math.floor((p.t-today)/DAY));
  const toneOf=d=>d<=3?'t-hot':d<=10?'t-warm':d<=28?'t-soon':'t-far';
  function rowHtml({a,p},roll){
    const d=daysTo(p), tone=toneOf(d);
    const paper=(D.papers[a.paper]&&D.papers[a.paper].name)||a.paper;
    const worth=a.hurdle?null:(a.weight?a.weight+'% of the paper':(a.pts?a.pts+' pts':null));
    const r=roll[a.id];
    let body;
    if(a.kind==='assignment'||a.kind==='signoff'){
      body=`<div class="dlNote">${a.kind==='assignment'?'Written work':'Sign-offs'} — no recall deck behind this one, so ⚡ leaves it to you.</div>`;
    } else if(isFresh(r)){
      /* 0% is the correct arithmetic and the wrong sentence — a bar pinned at
         red-zero next to a countdown reads as "you are already failing" to a
         student who has simply never opened the app. State the size of the deck
         and what one session would do instead; the bar returns the moment
         anything is graded. */
      body=`<div class="dlBar fresh"><i style="width:0%"></i></div>
        <div class="dlPct"><b>Not started</b> — ${r.total} question${r.total===1?'':'s'} are enrolled for this and ready when you are.</div>`;
    } else if(r&&r.total>0){
      const pct=Math.round((1-r.due/r.total)*100);
      const cls=pct>=80?'ok':pct>=50?'mid':'low';
      const w=weakest(r);
      // A final spans the whole paper, but a deck for one module still bids
      // into it — so this is the one row where a high % genuinely misleads.
      // Say so on the row itself; the count alone doesn't carry it.
      body=`<div class="dlBar"><i class="${cls}" style="width:${pct}%"></i></div>
        <div class="dlPct"><b class="${cls}">${pct}%</b> of the ${r.total} question${r.total===1?'':'s'} in play for this are in good standing${w?` · weakest: <b>${esc(w)}</b>`:''}</div>
        ${a.kind==='exam'?`<div class="dlNote dim">An exam spans the whole paper — this counts only the decks built so far.</div>`:''}`;
    } else if(r&&r.links.length){
      body=`<div class="dlNote">${esc(r.links[0].app)} is enrolled — it's a live drill, so it tracks your progress inside the app, not here.</div>`;
    } else {
      body=`<div class="dlNote dim">No question deck enrolled yet — ⚡ can't help with this one until an app for it is opened on this device.</div>`;
    }
    return `<div class="dlRow">
      <div class="dlNm">${esc(a.name)}${a.hurdle?'<span class="dlHurdle">MUST PASS</span>':''}</div>
      <div class="dlDays ${tone}">${d}<span>d</span></div>
      <div class="dlSub">${esc(paper)}${worth?' · '+worth:''} · ${whenLabel(a,p)}</div>
      ${body}</div>`;
  }

  /* v2: the landing shows ONE row — the nearest sitting — and the other
     fourteen live behind it in the 🗓 sheet. Nothing was deleted; the wall just
     stopped being the first thing you read. Same honesty rules apply to this
     row as to the sheet: the bar is share-not-due of the questions IN PLAY, the
     count is printed beside it, and no deck means no bar. */
  /* v3: the hero. The nearest sitting as ONE big number, wearing the hue of
     the paper that owns it — so a glance gives you both how soon and which
     paper. The other fourteen stay in the 🗓 sheet behind a tap; the readiness
     bar moved there too, because a percentage needs its question count beside
     it to be honest and neither fits at 62px. */
  function renderNext(){
    const host=$('#nextDl'); if(!host) return;
    const rows=dlRows();
    if(!rows.length){ host.innerHTML=''; return; }
    const row=rows[0], a=row.a, p=row.p, d=daysTo(p);
    const paper=(D.papers[a.paper]&&D.papers[a.paper].name)||a.paper;
    const HUE={hs2:'--hs', inp:'--inp', pharm:'--ph'}[a.paper];
    const ch=[];

  function countUp(el,to){
    if(!el||to>200||matchMedia('(prefers-reduced-motion:reduce)').matches){return;}
    const t0=performance.now();
    (function step(t){
      const q=Math.min(1,(t-t0)/520), e=1-Math.pow(1-q,5);   // easeOutQuint, Giga's curve
      el.textContent=Math.round(e*to);
      if(q<1) requestAnimationFrame(step); else el.textContent=to;
    })(t0);
  }

      .reduce((s,a)=>s+a.topics.reduce((n,t)=>n+t.cards.length,0),0);

  /* ══════════════ the player — Giga's loop, in vanilla ══════════════════════
     produce → reveal → REWARD → next. The reward beat is the piece v1 was
     missing: after a grade the SAME card stays up long enough to read the rest
     it just earned. Ported from gigastudyapp components/studio/DrillView.jsx +
     StudySession.jsx and lib/store/{drill,study}.js.

       flash = think → flip → Again/Hard/Good/Easy (keys 1–4)
       mcq   = pick (keys 1–n) → instant right/wrong + why → Next
       saq   = say your points → flip → "how many did you get?" (keys 0–n)
       chain = TYPE the missing beads/verbs → reveal the pathway → 1–4

     Two rules that are not negotiable, both learned the hard way:
       · Bind handlers PER BUTTON, never on a container. During a re-render a
         container listener still catches the click that CAUSED the render (the
         event is mid-bubble) — reveal falls straight through to the reward beat
         and grading is skipped entirely.
       · The reward beat only exists when there is something real to show. An
         app that publishes no `ladder`/`sr` advances immediately, exactly as
         before, rather than pausing on two empty dials. */
  const GRADES=[['Again','1','g0'],['Hard','2','g1'],['Good','3','g2'],['Easy','4','g3']];
  const saqGrade=(n,tot)=>{ const p=tot?n/tot:0; return p>=1?3:p>=0.8?2:p>=0.5?1:0; };
  const escA=s=>esc(s).replace(/"/g,'&quot;');
  // deliberately dumb compare, for the neutral "same" note ONLY — never a grade
  const norm=s=>String(s||'').toLowerCase().replace(/&/g,' and ')
    .replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
  const dayKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const reduceMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  function toast(msg){ const t=document.createElement('div'); t.className='sbpToast';
    t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1900); }
  function bumpStreak(){
    // local day key, not toISOString — at UTC+12/13 the UTC date rolls over at
    // lunchtime, which made the streak tick over mid-afternoon.
    const st=jget(SK,{last:'',n:0}), now=new Date();
    const k=dayKey(now), y=dayKey(new Date(Date.now()-DAY));
    if(st.last!==k){ st.n=(st.last===y)?st.n+1:1; st.last=k; jset(SK,st); }
    return st.n;
  }
  /* a real effort history, so the weekly trend on the done screen is honest.
     A forgiving TREND, never a streak — some days are zero and that's fine.
     (study-progress.js:103 logReconstruction, in localStorage.) */
  const RK='studybus.recon';
  function logRecon(n){
    const g=jget(RK,{}), k=dayKey(new Date());
    g[k]=(g[k]||0)+(n||1);
    const ks=Object.keys(g).sort(); while(ks.length>70) delete g[ks.shift()];
    jset(RK,g);
  }
  function weekStats(){
    const g=jget(RK,{}), L=['S','M','T','W','T','F','S'], t=new Date(), out=[];
    let max=1;
    for(let k=6;k>=0;k--){
      const d=new Date(t); d.setDate(t.getDate()-k);
      const c=g[dayKey(d)]||0; if(c>max) max=c;
      out.push({day:L[d.getDay()],count:c,today:k===0});
    }
    return out.map(o=>({day:o.day,count:o.count,today:o.today,pct:Math.round(o.count/max*100)}));
  }

  const CHAIN_PROMPT={
    1:['Fill the gap','One concept is missing — recall what belongs there.'],
    2:['Name the link','How do these two connect? Put the relationship into words.'],
    3:['Carry it on','Rebuild the rest of the path from where it breaks — from memory.'],
    4:['Rebuild from the seed','Only the first concept is given. Reconstruct the whole path from memory.'],
  };
  // deterministic, NO-AI narration of a chain into a sentence — the honest
  // "why it holds" payload for the reveal (DrillView.jsx:212 narrateChain)
  function narrate(beads,verbs){
    if(!beads||beads.length<2) return '';
    let s='<b>'+esc(beads[0])+'</b>';
    for(let k=0;k+1<beads.length;k++){
      s+= k===0?' ':', which ';
      s+= verbs[k]?('<i>'+esc(verbs[k])+'</i> '):'connects to ';
      s+='<b>'+esc(beads[k+1])+'</b>';
    }
    return s+'.';
  }

  function openPlayer(plan){
    const q=plan.queue.slice(), repeated={};
    const tally={done:0,correct:0,missed:0,mins:0,byLabel:{},
                 hasSR:false,strengthened:0,boxUps:0,levelUps:0,maxDays:0};
    let i=0, phase='produce', typed={}, picked=null, gained=null;
    // which card FACE the panel is currently showing, as `index:shown`. The
    // flip is a content change, not a repaint — see paint().
    let painted='';
    const scrim=document.createElement('div'); scrim.className='sbScrim';
    const panel=document.createElement('div'); panel.className='sbPanel';
    scrim.appendChild(panel);
    document.body.appendChild(scrim); document.body.style.overflow='hidden';
    scrim.onclick=e=>{ if(e.target===scrim) close(); };
    const teardown=()=>{ document.removeEventListener('keydown',onKey); scrim.remove(); document.body.style.overflow=''; };
    const close=()=>{ tally.done?finish(true):(teardown(),refresh()); };

    function writeGrade(leg,r){          // crash-safe: every grade lands immediately
      const gk='studybus.grades.'+leg.app, log=jget(gk,[]);
      log.push({card:leg.card.id,r:r,ts:Date.now()}); jset(gk,log);
      const h=plays(); h[leg.app+':'+leg.card.id]={ts:Date.now(),r:r}; jset(HP,h);
    }
    function record(leg,r,e){
      writeGrade(leg,r);
      logRecon(1);
      if(e){ tally.hasSR=true;
        if(r>0) tally.strengthened++;
        if(e.boxUp) tally.boxUps++;
        if(e.levelUp) tally.levelUps++;
        if(e.days>tally.maxDays) tally.maxDays=e.days; }
      if(leg.repeat) return;                 // round 2 trains the SRS, not the tally
      // minutes of actual retrieval, from the same per-type estimate the plan
      // packed with. (v1 reported "marks defended" = score × minutes, which was
      // priority-weighted minutes wearing a mark's clothes — a vanity number.)
      tally.done++; tally.mins+=estMin(leg.card);
      if(r===0){
        tally.missed++; tally.byLabel[leg.label]=(tally.byLabel[leg.label]||0)+1;
        const k=leg.app+':'+leg.card.id;
        if(!repeated[k]&&q.length<44){ repeated[k]=1; q.push(Object.assign({},leg,{repeat:true}));
          toast("Missed — it'll come back before the end ↩"); }
      } else tally.correct++;
    }

    /* flip the current card away as the next flips in (DrillView.jsx:66) */
    function flipOut(){
      if(reduceMotion()) return;
      const el=panel.querySelector('.stCard'); if(!el) return;
      const r=el.getBoundingClientRect(), g=el.cloneNode(true);
      g.className='stCard stGhost';
      g.style.left=r.left+'px'; g.style.top=r.top+'px';
      g.style.width=r.width+'px'; g.style.height=r.height+'px';
      g.style.transform='perspective(1200px) rotateY(0deg)';
      g.style.transition='transform .3s cubic-bezier(.4,0,1,1),opacity .26s ease';
      document.body.appendChild(g);
      requestAnimationFrame(()=>{ g.style.opacity='0';
        g.style.transform='perspective(1200px) rotateY(-12deg) translateY(-4px)'; });
      setTimeout(()=>g.remove(),340);
    }
    function advance(){ flipOut(); i++; typed={}; picked=null; gained=null; phase='produce'; paint(); }
    function reveal(){
      if(phase!=='produce') return;
      const c=q[i].card; if(c.type==='mcq') return;
      panel.querySelectorAll('.tin').forEach(el=>{ typed[el.dataset.k]=el.value; });
      phase='reveal'; paint();
    }
    function grade(r){
      if(phase!=='reveal') return;         // idempotent against a stale keypress
      const leg=q[i];
      gained=earned(leg.ladder,leg.card.sr,r);
      record(leg,r,gained);
      if(gained){ phase='reward'; paint(); } else advance();
    }
    function pick(n){
      if(phase!=='produce') return;
      const leg=q[i], c=leg.card, ok=n===c.correct;
      picked=n;
      gained=earned(leg.ladder,c.sr,ok?2:0);
      record(leg, ok?2:0, gained);        // recognition: right = Good, never Easy
      phase='reward'; paint();            // the card is already graded — one beat
    }

    /* ---------- rendering ---------- */
    function pathHtml(){
      const MAX=14, t=q.length||1, count=Math.max(1,Math.min(t,MAX)), n=i+1;
      const step=t>MAX?Math.max(1,Math.round(n/t*count)):n;
      let s='';
      for(let k=1;k<=count;k++) s+=`<i class="${k<step?'done':k===step?'cur':''}"></i>`;
      return `<div class="stPath" role="progressbar" aria-valuenow="${n}" aria-valuemin="1" aria-valuemax="${t}" aria-label="Card ${n} of ${t}">${s}</div>`;
    }
    const ladderHtml=lvl=>`<div class="stLadder" title="How much of this pathway is hidden — it climbs as you earn it">`+
      [1,2,3,4].map(n=>`<div class="stLvl ${n===lvl?'on':''} ${n<lvl?'done':''}"><div class="d"></div><span>L${n}</span></div>`).join('')+`</div>`;
    function chainHtml(c,shown){
      const beads=c.beads, verbs=c.verbs;
      const hb=new Set(c.hiddenBeads||[]), hl=new Set(c.hiddenLinks||[]);
      const slot=(k,truth,isVerb,hid)=>{
        if(!hid) return esc(truth);                 // visible scaffolding
        if(!shown) return `<input class="tin${isVerb?' v':''}" data-k="${k}" value="${escA(typed[k]||'')}"
          placeholder="${isVerb?'the link…':'the concept…'}" autocomplete="off" spellcheck="false" enterkeyhint="next"
          aria-label="${isVerb?'Name the relationship':'Name the concept'}">`;
        // what you typed stays UNDER the truth — never replaced by it, never
        // marked wrong. The ✓ is on beads only (a free-text verb would never
        // match) and it never touches the grade. You stay the judge.
        const you=(typed[k]||'').trim();
        const same=!isVerb&&you&&norm(you)===norm(truth);
        return esc(truth)+(you
          ? `<span class="said${same?' match':''}">you said <b>${esc(you)}</b>${same?' ✓ same':''}</span>`
          : `<span class="said blank">you left this blank</span>`);
      };
      let h='<span class="fill"></span>', vi=0;
      for(let n=0;n<beads.length;n++){
        const hid=hb.has(n);
        h+=`<div class="stBead${n===0?' seed':''}${hid&&!shown?' hole':''}${hid&&shown?' solved':''}" style="--i:${vi++}">${slot('b'+n,beads[n],false,hid)}</div>`;
        if(n<verbs.length){
          const vh=hl.has(n);
          h+=`<div class="stLink${vh&&!shown?' hole':''}${vh&&shown?' solved':''}" style="--i:${vi++}">${slot('l'+n,verbs[n],true,vh)}</div>`;
        }
      }
      return `<div class="stChain${shown?' lit':''}" aria-live="polite">${h}</div>`;
    }
    function chainReveal(c){
      const hb=c.hiddenBeads||[], hl=c.hiddenLinks||[];
      let ans='';
      if(hb.length===1&&hl.length===0) ans=`<div class="stAnswer" style="--d:.5s">The missing concept is <b>${esc(c.beads[hb[0]])}</b>.</div>`;
      else if(hl.length===1&&hb.length===0) ans=`<div class="stAnswer" style="--d:.5s">The link is <b>${esc(c.verbs[hl[0]])}</b>.</div>`;
      const why=(c.why&&String(c.why).trim())||narrate(c.beads,c.verbs);
      const w=why?`<div class="stWhyBox" style="--d:${ans?'.64s':'.5s'}"><span class="lbl">Why it holds:</span> ${why}</div>`:'';
      return (ans||w)?`<div class="stReveal">${ans}${w}</div>`:'';
    }
    function rewardHtml(){
      if(!gained) return '';
      const e=gained;
      return `<div class="stReward${e.again?' lapse':''}" aria-live="polite">
        <div class="stDial"><div class="l">Spacing</div>
          <div class="v${e.boxUp&&!e.again?' up':''}">${e.again?'Back shortly':'↻ '+returnLabel(e.days)+(e.boxUp?' ↑':'')}</div></div>
        <div class="stDial"><div class="l">Scaffolding</div>
          <div class="v${e.levelUp?' up':''}">${e.levelUp
            ? `L${e.levelFrom}→L${e.levelTo} · hides more`
            : `Level ${e.levelTo} · steady`}</div></div>
      </div>`;
    }
    const gradesHtml=()=>`<div class="stGrades" role="group" aria-label="Grade your recall">${
      GRADES.map((g,r)=>`<button data-a="grade" data-r="${r}" class="${g[2]}">${g[0]}<span class="k">${g[1]}</span></button>`).join('')}</div>`;

    function paint(){
      if(i>=q.length){ finish(false); return; }
      const leg=q[i], c=leg.card, shown=phase!=='produce';
      const isChain=c.type==='chain';
      const lvl=Math.max(1,Math.min(4,+c.level||1));
      // The flip belongs to a change of FACE, not to every paint: a new card
      // flips in, and produce → reveal turns this one over. reveal → reward
      // repaints the same face (only the dials below it are new), so it sits
      // still — otherwise the answer, and the whole chain power-on under it,
      // replay a second time just to show the two dials.
      const face=i+':'+(shown?1:0), flipCls=face===painted?'stSettled':'stFlipIn';
      painted=face;
      let prompt, body, acts='';

      if(isChain){
        const p=CHAIN_PROMPT[lvl]||CHAIN_PROMPT[1];
        prompt=shown?`<b>${esc(c.name||'The pathway')}.</b> Here it is in full — how did you do?`
                    :`<b>${p[0]}.</b> ${p[1]}`;
        body=`<div class="stCard">${chainHtml(c,shown)}</div>${shown?chainReveal(c):''}`;
      } else if(c.type==='mcq'){
        prompt=`<b>Pick one.</b> Recognition only — right still counts as Good, never Easy.`;
        const opts=(c.options||[]).map((o,n)=>{
          let cls='';
          if(shown){ if(n===c.correct) cls=' class="right"'; else if(n===picked) cls=' class="wrong"'; }
          return `<button data-a="opt" data-n="${n}"${shown?' disabled':''}${cls}>${esc(o)}</button>`;
        }).join('');
        const ok=picked===c.correct;
        const why=shown?`<div class="stWhy">${ok?'✅ Right. ':'<span class="stMiss">✗ Not this one.</span> '}${c.why||''}</div>`:'';
        body=`<div class="stCard"><div class="stQ">${c.q}</div><div class="stOpts">${opts}</div>${why}</div>`;
      } else if(c.type==='saq'){
        const pts=c.points||[];
        prompt=shown?`<b>${pts.length} marking point${pts.length===1?'':'s'}.</b> Honestly — how many did you say?`
                    :`<b>${pts.length} marking point${pts.length===1?'':'s'}.</b> Say yours out loud, then flip.`;
        body=`<div class="stCard${shown?'':' tap'}"${shown?'':' data-a="reveal"'}><div class="stQ">${c.q}</div>${shown
          ? `<div class="stA"><ol>${pts.map(p=>`<li>${p}</li>`).join('')}</ol>${c.model?`<p class="stModel">${c.model}</p>`:''}</div>`
          : `<p class="stHint">Cover it, say your points aloud, then reveal. (tap the card or press Enter)</p>`}</div>`;
      } else {
        prompt=shown?`<b>Here it is.</b> Grade yourself honestly — a miss is information, not a failure.`
                    :`<b>Produce it.</b> Say the answer out loud before you flip.`;
        body=`<div class="stCard${shown?'':' tap'}"${shown?'':' data-a="reveal"'}><div class="stQ">${c.q}</div>${shown
          ? `<div class="stA">${c.a||''}</div>`
          : `<p class="stHint">Say the answer out loud — then flip. (tap the card or press Enter)</p>`}</div>`;
      }

      // the action bar, per phase
      if(phase==='reward'){
        acts=`<button class="stGo" data-a="next">Next ↵</button>`;
      } else if(phase==='reveal'){
        if(c.type==='saq'){
          const n=(c.points||[]).length;
          acts=`<div class="stChips" role="group" aria-label="How many marking points did you get?">${
            Array.from({length:n+1},(_,k)=>`<button data-a="saq" data-n="${k}">${k}</button>`).join('')}</div>`;
        } else acts=gradesHtml();
      } else if(c.type!=='mcq'){
        acts=`<button class="stGo" data-a="reveal">Reveal ↵</button>
              <button class="stSkip" data-a="skip">⏭ skip this card</button>`;
      } else {
        acts=`<button class="stSkip" data-a="skip">⏭ skip this card</button>`;
      }

      panel.innerHTML=`<div class="stTop">
          <button class="stX" data-a="close" title="End session — every answer so far is already saved" aria-label="End session">✕</button>
          ${pathHtml()}<span class="stN">${i+1}/${q.length}</span></div>
        <div class="stHead"><span class="stSubj">${esc(leg.label)}${leg.repeat?' · <b class="stRe">round 2</b>':''}</span>
          ${isChain?ladderHtml(lvl):`<span class="stWho">${esc(leg.appName)}</span>`}</div>
        <div class="stPrompt">${prompt}</div>
        <div class="${flipCls}">${body}${rewardHtml()}</div>
        <div class="stActs">${acts}</div>`;
      bind();
    }

    /* PER-BUTTON binding. A delegated listener on a container catches the very
       click that triggered the re-render — see the header note. */
    function bind(){
      panel.querySelectorAll('[data-a]').forEach(el=>{
        const a=el.dataset.a;
        el.onclick=ev=>{
          ev.stopPropagation();
          if(a==='close') close();
          else if(a==='reveal') reveal();
          else if(a==='skip') advance();
          else if(a==='next') advance();
          else if(a==='opt') pick(+el.dataset.n);
          else if(a==='grade') grade(+el.dataset.r);
          else if(a==='saq') grade(saqGrade(+el.dataset.n,(q[i].card.points||[]).length));
          else if(a==='finishNow'){ const last=jget(LK,null)||{};
            last.outro=false; last.outroDone=true; jset(LK,last); teardown(); showDoneOverlay(last); }
        };
      });
      // Enter walks DOWN the chain; Enter on the last field reveals. Blank
      // fields are fine and never nagged about.
      const ins=[...panel.querySelectorAll('.tin')];
      ins.forEach((el,n)=>{
        el.oninput=()=>{ typed[el.dataset.k]=el.value; };
        el.onkeydown=ev=>{
          if(ev.key!=='Enter') return;
          ev.preventDefault();
          if(n+1<ins.length) ins[n+1].focus(); else reveal();
        };
      });
      if(ins.length) ins[0].focus({preventScroll:true});
      else if(phase==='reward') panel.querySelector('[data-a="next"]')?.focus({preventScroll:true});
    }

    function finish(early){
      const weak=Object.keys(tally.byLabel).sort((a,b)=>tally.byLabel[b]-tally.byLabel[a])[0]||null;
      const last={ts:Date.now(),done:tally.done,correct:tally.correct,missed:tally.missed,
        mins:Math.max(1,Math.round(tally.mins)),weak:weak,
        hasSR:tally.hasSR,strengthened:tally.strengthened,boxUps:tally.boxUps,
        levelUps:tally.levelUps,maxDays:tally.maxDays,
        outro:!early&&plan.outro.length>0,outroDone:false};
      jset(LK,last);
      if(!early&&plan.outro.length){ drawOutro(last); }
      else { last.outroDone=true; jset(LK,last); teardown(); showDoneOverlay(last); }
    }
    function drawOutro(last){
      const o=plan.outro[0];
      panel.innerHTML=`<div class="stDone">
        <h3>Cards done ✅</h3>
        <p class="sub2">${last.done} answered · one more thing before the tally…</p>
        <a class="stGo" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="${escA(addQ(o.url,'sb=out'))}">${esc(o.label)} · ${o.minutes}′ →</a>
        <div class="alt"><a data-a="finishNow">Skip the drill — see the tally</a></div>
      </div>`;
      bind();
    }

    function onKey(e){
      if(e.repeat) return;                            // no held-key double-grade
      const tag=(e.target&&e.target.tagName||'').toLowerCase();
      const typing=tag==='input'||tag==='textarea';
      if(e.key==='Escape'){ if(typing){ e.target.blur(); return; } close(); return; }
      const leg=q[i]; if(!leg) return;
      const c=leg.card;
      if(phase==='reward'){
        if((e.key==='Enter'||e.key===' ')&&!typing){ e.preventDefault(); advance(); }
        return;
      }
      if(phase==='produce'){
        if(e.key==='Enter'&&!typing&&c.type!=='mcq'){ e.preventDefault(); reveal(); return; }
        if(c.type==='mcq'&&!typing&&/^[1-9]$/.test(e.key)&&+e.key<=(c.options||[]).length){ e.preventDefault(); pick(+e.key-1); }
        return;
      }
      if(typing) return;                              // a digit must reach the field
      if(c.type==='saq'){
        const n=(c.points||[]).length;
        if(/^[0-9]$/.test(e.key)&&+e.key<=n){ e.preventDefault(); grade(saqGrade(+e.key,n)); }
        return;
      }
      if(/^[1-4]$/.test(e.key)){ e.preventDefault(); grade(+e.key-1); }
    }
    document.addEventListener('keydown',onKey);
    paint();
  }

  /* ---- the honest done screen: real numbers, one place, never mid-session.
     Confetti fires ONLY when something genuinely advanced — a celebration over
     a blank session would discredit every other signal on the page. ---- */
  function showDoneOverlay(last){
    const n=bumpStreak(), week=weekStats();
    const scrim=document.createElement('div'); scrim.className='sbScrim';
    const panel=document.createElement('div'); panel.className='sbPanel';
    scrim.appendChild(panel);
    document.body.appendChild(scrim); document.body.style.overflow='hidden';
    const advanced=(last.correct||0)>0;
    const longest=last.maxDays||0;
    const longestLbl=longest>=30?Math.round(longest/30)+' mo':longest>=1?longest+' d':'—';
    // Giga's four SR stats when the apps published a ladder; the honest
    // fallback (what we can always count) when they didn't.
    const stats=last.hasSR
      ? [[last.strengthened||0,'p','cards strengthened'],
         [last.boxUps||0,'m','climbed to a longer interval'],
         [last.levelUps||0,'p','reached a new rung (hides more)'],
         [longestLbl,'m','longest new rest earned']]
      : [[last.done||0,'p','cards rebuilt'],
         [last.correct||0,'m','answered right'],
         [last.missed||0,'p','coming back sooner'],
         [(last.mins||0)+'′','m','of actual retrieval']];
    panel.innerHTML=`<div class="stDone">
      ${advanced?'<div class="stConf" id="stConf"></div>':''}
      <div class="stRing"><svg width="88" height="88" viewBox="0 0 88 88">
        <circle class="bg" cx="44" cy="44" r="34" fill="none" stroke-width="7"/>
        <circle class="fg" cx="44" cy="44" r="34" fill="none" stroke-width="7"/></svg>
        <div class="ck">✓</div></div>
      <h3>Session complete</h3>
      <p class="sub2">Here's what genuinely moved — straight off the schedule, not a vanity score.${
        last.hasSR?'':' <span style="opacity:.75">(Your apps have not published their review schedule yet, so these are counts, not intervals.)</span>'}</p>
      <div class="stStats" role="status" aria-live="polite">${stats.map(s=>
        `<div class="stStat"><div class="big ${s[1]}">${s[0]}</div><div class="cap">${s[2]}</div></div>`).join('')}</div>
      <div class="stTrend">
        <div class="stTrendLbl">This week · cards rebuilt</div>
        <div class="stTrendBars">${week.map((d,k)=>
          `<div class="col"><div class="bar${d.today?' today':''}" style="--h:${Math.max(4,Math.round(d.pct*0.42))}px;--k:${k}"></div><span>${d.day}</span></div>`).join('')}</div>
      </div>
      ${last.missed&&last.weak
        ? `<p class="stWeak">Most missed: <b>${esc(last.weak)}</b> — those come back sooner now. ${n}-day streak 🔥</p>`
        : `<p class="stWeak">Clean run — nothing missed 🎯 &nbsp;${n}-day streak 🔥</p>`}
      <div class="stActs"><button class="stGo" data-a="again">⚡ One more session</button></div>
      <div class="alt"><a data-a="close">Done for now</a></div>
    </div>`;
    if(advanced&&!reduceMotion()){
      const host=panel.querySelector('#stConf');
      const cols=[getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#6366F1',
                  '#32D74B','#FF9F0A','#FF453A','#37d4e6'];
      for(let k=0;k<40;k++){
        const p=document.createElement('i');
        p.style.left=(50+(Math.random()*52-26))+'%';
        p.style.background=cols[k%cols.length];
        p.style.setProperty('--dx',(Math.random()*240-120)+'px');
        p.style.setProperty('--rot',(Math.random()*720-360)+'deg');
        p.style.animationDelay=(Math.random()*0.18)+'s';
        host.appendChild(p);
      }
    }
    panel.querySelectorAll('[data-a]').forEach(el=>{
      el.onclick=()=>{ const a=el.dataset.a;
        scrim.remove(); document.body.style.overflow=''; refresh();
        if(a==='again') start(); };
    });
    scrim.onclick=e=>{ if(e.target===scrim){ scrim.remove(); document.body.style.overflow=''; refresh(); } };
  }

  refresh();
  window.addEventListener('pageshow',refresh);       // coming back from an app re-scores

  /* ---- return from the outro drill (?sbdone=1) → the full-session tally ---- */
  if(new URLSearchParams(location.search).get('sbdone')){
    const last=jget(LK,null);
    if(last&&Date.now()-last.ts<12*HOUR&&!last.outroDone){
      last.outroDone=true; jset(LK,last);
      showDoneOverlay(last);
    }
    history.replaceState(null,'',location.pathname);   // clean the URL so refresh ≠ re-celebrate
  }
})();

/* ---------- visit counting: the opt-out, and the owner's traffic readout ----------
   The counter itself is cloud/count.js (fire-and-forget, first-party, no cookie).
   This block is only the two bits of UI around it.

   The readout is honest about what it cannot tell you. It reports VISITORS
   (distinct browsers), not people: one person on a phone and a laptop is two,
   and clearing site data makes a returning visitor look new. Signed-in accounts
   are the only "who" that is real, and they are shown separately for that
   reason — the rest of the traffic is genuinely anonymous, by design. */
(function(){
  // ── the opt-out toggle ─────────────────────────────────────────────────
  // Only runs when the privacy note is on the page. The note was removed, so
  // this is dormant — but the readout below must NOT be gated on it.
  const OFF='hub.nocount';
  const el=$('#btnPrivOff');
  if(el){
    const box=el.parentElement;
    const paint=()=>{
      let off=false; try{ off=localStorage.getItem(OFF)==='1'; }catch(e){}
      box.classList.toggle('off',off);
      el.textContent = off ? 'Not counting you — turn back on' : "Don't count me";
    };
    el.onclick=()=>{
      try{
        if(localStorage.getItem(OFF)==='1') localStorage.removeItem(OFF);
        else localStorage.setItem(OFF,'1');
      }catch(e){}
      paint();
    };
    paint();
  }

  // ── owner readout ──────────────────────────────────────────────────────
  // Both of Jeremy's accounts. Must stay in step with the "owner reads stats"
  // row-level policy in cloud/schema.sql — this list only hides the box; the
  // database is what actually refuses the rows.
  const OWNERS=['jeremyspm1999@gmail.com','masa64@manukaumail.com'];
  const host=$('#statsBox');
  if(!host || !window.Cloud || !Cloud.enabled) return;

  const top=(rows,pick,n)=>{
    const m=new Map();
    rows.forEach(r=>{ const k=pick(r); if(k) m.set(k,(m.get(k)||0)+1); });
    return [...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,n);
  };
  const table=(pairs,empty)=>pairs.length
    ? `<table>${pairs.map(p=>`<tr><td>${esc(p[0])}</td><td>${p[1]}</td></tr>`).join('')}</table>`
    : `<div style="color:var(--tx3);font-style:italic">${empty}</div>`;

  async function load(){
    host.innerHTML=`<details class="stats"><summary>Traffic</summary><div class="body" style="color:var(--tx3)">Loading…</div></details>`;
    const since=new Date(Date.now()-30*864e5).toISOString();
    const {data,error}=await Cloud.client
      .from('pageviews').select('at,site,path,ref,visitor,session,user_id,device,tz')
      .gte('at',since).order('at',{ascending:false}).limit(20000);
    if(error){ host.innerHTML=`<details class="stats"><summary>Traffic</summary><div class="body warn">Couldn't load: ${esc(error.message)}</div></details>`; return; }
    const rows=data||[];
    if(!rows.length){
      host.innerHTML=`<details class="stats"><summary>Traffic · last 30 days</summary>
        <div class="body" style="color:var(--tx3)">No visits recorded yet. The counter went live 27/07/2026 — this stays empty until someone opens the hub.</div></details>`;
      return;
    }
    const day=t=>new Date(t).toISOString().slice(0,10);
    const today=day(Date.now()), wk=new Date(Date.now()-7*864e5).toISOString();
    const uniq=a=>new Set(a).size;
    const week=rows.filter(r=>r.at>=wk);
    // A visit = one browser session. Signed-in accounts are the only real "who".
    const accounts=uniq(rows.filter(r=>r.user_id).map(r=>r.user_id));
    const days=[...new Set(rows.map(r=>day(r.at)))].sort().slice(-14).reverse();
    const perDay=new Map(); rows.forEach(r=>{ const d=day(r.at); perDay.set(d,(perDay.get(d)||0)+1); });

    // Collapsed by default (no `open`), and re-rendered on every load, so a
    // refresh always closes it again. The summary carries the headline number
    // so the box is worth glancing at without opening it.
    host.innerHTML=`<details class="stats">
      <summary>Traffic · last 30 days · ${rows.length} views</summary>
      <div class="body">
      <div class="nums">
        <div class="n"><b>${rows.length}</b><span>page views</span></div>
        <div class="n"><b>${uniq(rows.map(r=>r.session))}</b><span>visits</span></div>
        <div class="n"><b>${uniq(rows.map(r=>r.visitor))}</b><span>visitors</span></div>
        <div class="n"><b>${week.length}</b><span>views this week</span></div>
        <div class="n"><b>${rows.filter(r=>day(r.at)===today).length}</b><span>today</span></div>
        <div class="n"><b>${accounts}</b><span>signed-in accounts</span></div>
      </div>
      <div class="lbl">Most-opened pages</div>${table(top(rows,r=>r.site+' '+r.path,8),'—')}
      <div class="lbl">Came from</div>${table(top(rows,r=>r.ref,6),'No external referrers — everyone typed the link or used a bookmark.')}
      <div class="lbl">Device</div>${table(top(rows,r=>r.device,3),'—')}
      <div class="lbl">Timezone</div>${table(top(rows,r=>r.tz,6),'—')}
      <div class="lbl">By day</div>${table(days.map(d=>[d,perDay.get(d)||0]),'—')}
      <div style="margin-top:12px;font-size:10px;color:var(--tx3);line-height:1.5">
        “Visitors” counts distinct browsers, not people — your own phone and laptop are two,
        and clearing site data makes someone look new. Only the ${accounts} signed-in account${accounts===1?'':'s'}
        above is a real identity; the rest is anonymous on purpose. Anyone using
        Global Privacy Control, or who pressed “Don't count me”, isn't in these numbers.
      </div>
      </div>
    </details>`;
  }
  Cloud.onChange(user=>{
    if(user && OWNERS.includes((user.email||'').toLowerCase())) load();
    else host.innerHTML='';
  });
})();

/* ---------- cloud account UI (only if Cloud is configured) ---------- */
(function(){
  if(!window.Cloud || !Cloud.enabled) return;   // dormant → hub looks exactly as before
  const btn=$('#btnAcct'), note=$('#cloudNote');
  btn.style.display='inline-flex';
  Cloud.onChange(user=>{
    if(user){
      btn.innerHTML=`<span class="dot"></span><span class="who">${esc(user.email||'signed in')}</span>`;
      btn.title='Signed in — click to sign out';
      note.innerHTML=`<span>☁️ <b>Synced.</b> Your progress in every app follows you to any device you sign in on.</span>`;
    } else {
      btn.innerHTML=`<svg class="ic"><use href="#i-cloud"/></svg>Sign in`;
      btn.title='Sign in to sync your progress across devices';
      note.innerHTML=`<span>☁️ <b>Cloud sync available.</b> Sign in once here and your progress syncs across devices. Optional — everything works offline without it.</span>`;
    }
  });
  btn.onclick=()=>{ Cloud.user() ? Cloud.signOut() : openAuth(); };

  function openAuth(){
    let mode='in';
    const m=document.createElement('div'); m.className='modal';
    const draw=()=>{
      m.innerHTML=`<div class="sheet">
        <button class="x" id="ax">✕</button>
        <h3>${mode==='in'?'Sign in':'Create account'}</h3>
        <p class="lead">${mode==='in'?'Sign in to sync your progress across devices.':'Just an email and a password — used only to keep your own data yours.'}</p>
        <div id="amsg"></div>
        <label>Email</label><input id="ae" type="email" autocomplete="email" placeholder="you@example.com"/>
        <label>Password</label><input id="ap" type="password" autocomplete="${mode==='in'?'current-password':'new-password'}" placeholder="${mode==='in'?'your password':'at least 6 characters'}"/>
        <button class="go" id="ago">${mode==='in'?'Sign in':'Create account'}</button>
        <div class="alt">${mode==='in'?`No account? <a id="aswap">Create one</a> &nbsp;·&nbsp; <a id="aforgot">Forgot password?</a>`:`Have an account? <a id="aswap">Sign in</a>`}</div>
        ${mode==='up'?`<p class="fineprint" style="margin:14px 0 0;font-size:12px;line-height:1.5;opacity:.6;text-align:center;">🔒 Your password is encrypted by our login provider — no one, including us, can ever see it. Please don't reuse a password from your bank or email. We only store your study progress.</p>`:''}
      </div>`;
      m.querySelector('#ax').onclick=()=>m.remove();
      m.querySelector('#aswap').onclick=()=>{ mode=mode==='in'?'up':'in'; draw(); };
      const fg=m.querySelector('#aforgot'); if(fg) fg.onclick=forgot;
      m.querySelector('#ago').onclick=submit;
      m.querySelector('#ap').onkeydown=e=>{ if(e.key==='Enter') submit(); };
      m.querySelector('#ae').focus();
    };
    async function submit(){
      const email=m.querySelector('#ae').value.trim(), pw=m.querySelector('#ap').value;
      const msg=m.querySelector('#amsg'), go=m.querySelector('#ago');
      if(!email||!pw){ msg.innerHTML=`<div class="msg err">Enter your email and password.</div>`; return; }
      go.disabled=true; go.textContent='…';
      let r;
      try{ r = mode==='in' ? await Cloud.signIn(email,pw) : await Cloud.signUp(email,pw); }
      catch(e){ r = {error:{message:'Something went wrong — try again.'}}; }
      if(r && r.error){
        msg.innerHTML=`<div class="msg err">${esc(r.error.message||'Something went wrong.')}</div>`;
        go.disabled=false; go.textContent=mode==='in'?'Sign in':'Create account';
        return;
      }
      // Sign-up with email confirmation ON returns a user but no session yet.
      if(mode==='up' && !(r.data&&r.data.session)){
        msg.innerHTML=`<div class="msg ok">Account made — check your email to confirm, then sign in.</div>`;
        go.disabled=false; go.textContent='Sign in'; mode='in'; return;
      }
      m.remove();   // onAuthStateChange updates the button + pulls data
    }
    async function forgot(){
      const email=m.querySelector('#ae').value.trim();
      const msg=m.querySelector('#amsg');
      if(!email){ msg.innerHTML=`<div class="msg err">Type your email above first, then tap “Forgot password?”.</div>`; m.querySelector('#ae').focus(); return; }
      msg.innerHTML=`<div class="msg ok">Sending…</div>`;
      let r; try{ r=await Cloud.resetPassword(email); }catch(e){ r={error:{message:'Something went wrong.'}}; }
      if(r && r.error){ msg.innerHTML=`<div class="msg err">${esc(r.error.message||'Could not send the reset email.')}</div>`; return; }
      msg.innerHTML=`<div class="msg ok">If an account exists for <b>${esc(email)}</b>, a reset link is on its way. <b>Check your spam folder</b> — it can take a few minutes.</div>`;
    }
    m.onclick=e=>{ if(e.target===m) m.remove(); };
    draw(); document.body.appendChild(m);
  }
})();

/* ---------- suggestions box: anyone can suggest & upvote, no login ---------- */
(function(){
  const DEV='hub.sugg.device', VOTED='hub.sugg.voted', MINE='hub.sugg.mine';
  // A random id per browser — the database's primary key makes it one like
  // per suggestion per device (honest visitors; not bulletproof, doesn't need to be).
  // It's also the secret that lets this device delete its own posts & likes.
  function dev(){
    let d=localStorage.getItem(DEV);
    if(!d){ d=(crypto.randomUUID&&crypto.randomUUID())||(Date.now().toString(36)+Math.random().toString(36).slice(2,12));
      try{ localStorage.setItem(DEV,d); }catch(e){} }
    return d;
  }
  // set helpers, reused for both "liked" and "my own posts" id lists
  function getSet(k){ try{ return new Set(JSON.parse(localStorage.getItem(k))||[]); }catch(e){ return new Set(); } }
  function addTo(k,id){ const s=getSet(k); s.add(id); try{ localStorage.setItem(k,JSON.stringify([...s])); }catch(e){} }
  function delFrom(k,id){ const s=getSet(k); s.delete(id); try{ localStorage.setItem(k,JSON.stringify([...s])); }catch(e){} }
  const voted=()=>getSet(VOTED), remember=id=>addTo(VOTED,id), forget=id=>delFrom(VOTED,id);
  const owned=()=>getSet(MINE),  ownPost=id=>addTo(MINE,id),   disown=id=>delFrom(MINE,id);
  async function db(){ if(window.Cloud&&Cloud.enabled){ await Cloud.ready; return Cloud.client; } return null; }
  const fmt=d=>{ try{ return new Date(d).toLocaleDateString(undefined,{day:'numeric',month:'short'}); }catch(e){ return ''; } };

  $('#btnSugg').onclick=function(){
    const m=document.createElement('div'); m.className='modal';
    m.innerHTML=`<div class="sheet wide">
      <button class="x" id="sx">✕</button>
      <h3>💡 Suggestions</h3>
      <p class="lead">What should I build next for the BN Hub? No account needed — drop an idea below, and 👍 like the ones you want most.</p>
      <div id="smsg"></div>
      <div class="sugg-form">
        <textarea id="sbody" maxlength="500" placeholder="e.g. A fluid &amp; electrolytes cram tool… a quiz per drug class… anything you wish existed."></textarea>
        <div class="sugg-row">
          <input id="sname" maxlength="40" placeholder="Name (optional — blank = anonymous)"/>
          <button class="go" id="ssend">Suggest</button>
        </div>
      </div>
      <div class="sugg-list" id="slist"><div class="sugg-note">Loading…</div></div>
    </div>`;
    m.onclick=e=>{ if(e.target===m) m.remove(); };
    m.querySelector('#sx').onclick=()=>m.remove();
    m.querySelector('#ssend').onclick=submit;
    document.body.appendChild(m);
    load();

    async function load(){
      const list=m.querySelector('#slist'); if(!list) return;
      const c=await db();
      if(!c){ list.innerHTML=`<div class="sugg-note">The suggestions box can't reach the server right now — try again in a minute.</div>`; return; }
      let r; try{ r=await c.from('suggestions')
        .select('id,body,author,created_at,votes:suggestion_votes(count)')
        .order('created_at',{ascending:false}).limit(200); }
      catch(e){ r={error:e}; }
      if(!r||r.error){ list.innerHTML=`<div class="sugg-note">Couldn't load suggestions — check your connection and try again.</div>`; return; }
      const liked=voted(), mineIds=owned();
      const rows=(r.data||[])
        .map(s=>({id:s.id,body:s.body,author:s.author,created_at:s.created_at,n:(s.votes&&s.votes[0]&&s.votes[0].count)||0}))
        .sort((a,b)=>b.n-a.n || new Date(b.created_at)-new Date(a.created_at));
      list.innerHTML = rows.length ? rows.map(s=>`
        <div class="sugg-item">
          <button class="like${liked.has(s.id)?' on':''}" data-id="${s.id}" title="${liked.has(s.id)?'You liked this — tap to remove':'Like'}">
            <span class="thumb">👍</span><span class="n">${s.n}</span>
          </button>
          <div class="txt">${esc(s.body)}<span class="byline">${s.author?esc(s.author):'Anonymous'} · ${fmt(s.created_at)}${mineIds.has(s.id)?` · <button class="sugg-del" data-id="${s.id}">Delete</button>`:''}</span></div>
        </div>`).join('')
        : `<div class="sugg-note">No suggestions yet — yours could be the first.</div>`;
      list.querySelectorAll('.like').forEach(b=>{ b.onclick=()=>like(b); });
      list.querySelectorAll('.sugg-del').forEach(b=>{ b.onclick=()=>del(b); });
    }

    function showErr(t){ const msg=m.querySelector('#smsg'); if(msg) msg.innerHTML=`<div class="msg err">${t}</div>`; }

    async function like(b){
      const id=b.dataset.id, n=b.querySelector('.n');
      const c=await db();
      if(voted().has(id)){
        // un-like → optimistic, then remove this device's vote via the owner-scoped RPC
        b.classList.remove('on'); b.title='Like'; n.textContent=String(Math.max(0,+n.textContent-1));
        let r; try{ r=c?await c.rpc('remove_vote',{p_id:id,p_voter:dev()}):{error:{message:'offline'}}; }
        catch(e){ r={error:{message:String(e)}}; }
        if(r&&r.error){
          b.classList.add('on'); b.title='You liked this — tap to remove'; n.textContent=String(+n.textContent+1);
          showErr("Couldn't remove your like — check your connection and try again."); return;
        }
        forget(id);
      } else {
        // like → optimistic insert
        b.classList.add('on'); b.title='You liked this — tap to remove'; n.textContent=String((+n.textContent||0)+1);
        let r; try{ r=c?await c.from('suggestion_votes').insert({suggestion_id:id,voter:dev()}):{error:{message:'offline'}}; }
        catch(e){ r={error:{message:String(e)}}; }
        // 23505 = this device already liked (e.g. in another tab) — that still counts.
        if(r&&r.error&&r.error.code!=='23505'){
          b.classList.remove('on'); b.title='Like'; n.textContent=String(Math.max(0,+n.textContent-1));
          showErr("Couldn't save your like — check your connection and try again."); return;
        }
        remember(id);
      }
    }

    async function del(b){
      const id=b.dataset.id;
      if(!confirm('Delete your suggestion? This can’t be undone.')) return;
      const c=await db();
      let r; try{ r=c?await c.rpc('delete_suggestion',{p_id:id,p_device:dev()}):{error:{message:'offline'}}; }
      catch(e){ r={error:{message:String(e)}}; }
      if(r&&r.error){ showErr("Couldn't delete it — check your connection and try again."); return; }
      disown(id); forget(id);
      load();
    }

    async function submit(){
      const body=m.querySelector('#sbody').value.trim();
      const name=m.querySelector('#sname').value.trim();
      const msg=m.querySelector('#smsg'), go=m.querySelector('#ssend');
      if(body.length<3){ msg.innerHTML=`<div class="msg err">Write a little more — a few words at least.</div>`; return; }
      go.disabled=true; go.textContent='…';
      const c=await db();
      // author_device tags the row with this browser's secret so only this device
      // can later delete it; .select() returns the new id so we can show that Delete button.
      let r; try{ r=c?await c.from('suggestions').insert({body:body,author:name||null,author_device:dev()}).select('id').single():{error:{message:'offline'}}; }
      catch(e){ r={error:{message:String(e)}}; }
      go.disabled=false; go.textContent='Suggest';
      if(r&&r.error){ msg.innerHTML=`<div class="msg err">Couldn't send it — check your connection and try again.</div>`; return; }
      if(r&&r.data&&r.data.id) ownPost(r.data.id);
      m.querySelector('#sbody').value='';
      msg.innerHTML=`<div class="msg ok">Added — thank you! 🎉</div>`;
      load();
    }
  };
})();
</script>
